services:
  db:
    image: postgres:15
    container_name: app-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app-web
    user: "1000:1000"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DATABASE_URL: postgres://${POSTGRES_USER:-appuser}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-appdb}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      LEAGUE_NAME: ${LEAGUE_NAME:-My Poker League}
      LEAGUE_TIMEZONE: ${LEAGUE_TIMEZONE:-America/Chicago}
    ports:
      - "80:8000"
    volumes:
      - ./media_files:/app/media
      - ./csvapp:/app/csvapp
    command:
      - sh
      - -c
      - |
        python manage.py collectstatic --noinput &&
        python manage.py makemigrations csvapp &&
        python manage.py migrate &&
        gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 4 --timeout 120 --access-logfile - --error-logfile -

